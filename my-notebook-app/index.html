<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook Desktop</title>
    <style>
        @font-face {
    font-family: 'Biro Script Plus';
    src: url('biro_script/Biro_Script_reduced.woff2') format('woff2'),
         url('biro_script/Biro_Script_reduced.woff') format('woff'),
         url('biro_script/Biro_Script_reduced.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Biro Script Plus', cursive;
            background-image: url('Images/Desk.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .desktop {
            width: 100vw;
            height: 100vh;
            position: relative;
            padding: 20px;
        }

        .new-book-button {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 240px;
            height: 240px;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 101;
            transform: rotate(-25deg);
        }

        .new-book-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
        }

        .book {
            position: absolute;
            width: 180px;
            height: 240px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .book:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .book.dragging {
            transform: scale(1.05);
            z-index: 50;
            transition: none;
        }

        .book img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.3));
        }

        .book-title {
            position: absolute;
            top: calc(50% - 37px);
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2c1810;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            max-width: 140px;
            line-height: 1.2;
            word-wrap: break-word;
            pointer-events: none;
        }

        /* Green Sphere Trash Button */
.green-sphere-trash {
    position: fixed;
    top: 75%;
    left: 13.3%;
    width: 385px;
    height: 385px;
    background: transparent;   /* fully transparent */
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 102;
    box-shadow: none;          /* no shadow */
    border: none;              /* no border */
}

.green-sphere-trash:hover,
.green-sphere-trash.drag-over {
    transform: translate(-50%, -50%) scale(1.2);
    background: transparent;   /* stays transparent */
    box-shadow: none;
}

.green-sphere-trash.drag-over {
    background: transparent;
    box-shadow: none;
}

        /* Trash Can Styles - Now non-interactive */
        .trash-can {
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 600px;
            height: 600px;
            z-index: 1;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .trash-can.drag-over {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
        }

        .trash-can img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        /* Custom Name Book Modal */
        .name-book-modal-content {
            background-image: url('Images/NameBookGUI.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 5% auto;
            width: 600px;
            height: 700px;
            position: relative;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        /* Text input line in middle of GUI */
        .book-name-line {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 40px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #333;
            font-family: 'Biro Script Plus', cursive;
            font-size: 24px;
            text-align: center;
            outline: none;
            color: #333;
            padding: 5px;
        }

        /* Error message styling */
        .error-message {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: #f44336;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
        }

        /* Book selection area */
        .book-selection {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 180px;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            padding: 10px;
        }

        .book-option {
            width: 60px;
            height: 80px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book-option:hover {
            transform: scale(1.1);
        }

        .book-option.selected {
            border: 2px solid #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
            transform: scale(1.1);
        }

        .book-option img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Custom buttons at bottom of GUI */
        .custom-modal-buttons {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
        }

        .custom-button {
            width: 120px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: none;
            background: none;
            padding: 0;
        }

        .custom-button:hover {
            transform: scale(1.05);
        }

        .custom-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Book Action Modal */
        .book-action-modal-content {
            background-image: url('Images/SinglePageGUI.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 10% auto;
            width: 350px;
            height: 600px;
            position: relative;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        .book-action-buttons {
            position: absolute;
            bottom: 32%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .book-action-button {
            width: 150px;
            height: 60px;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: none;
            background: none;
            padding: 0;
        }

        .book-action-button:hover {
            transform: scale(1.05);
        }

        .book-action-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Delete confirmation modal - Updated with custom GUI */
        .delete-modal-content {
            background-image: url('Images/DeleteBookGUI.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 1000px;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        /* Custom buttons for delete modal */
        .delete-modal-buttons {
            position: absolute;
            top: calc(65% - 75px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 60px;
        }

        .delete-modal-button {
            width: 200px;
            height: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: none;
            background: none;
            padding: 0;
        }

        .delete-modal-button:hover {
            transform: scale(1.05);
        }

        .delete-modal-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
    </style>
</head>
<body>
    <div class="desktop" id="desktop">
        <!-- New Book Button -->
        <div class="new-book-button" onclick="showNameModal()">
            <img src="Images/NewBook.png" alt="Create New Book">
        </div>
        
        <!-- Green Sphere Trash Button -->
        <div class="green-sphere-trash" id="greenSphereTrash"></div>
        
        <!-- Trash Can - Now purely decorative -->
        <div class="trash-can" id="trashCan">
            <img src="Images/Trash.png" alt="Delete Book">
        </div>
        
        <!-- Books will be dynamically added here -->
    </div>

    <!-- Modal for book name input with custom GUI -->
    <div id="nameModal" class="modal">
        <div class="name-book-modal-content">
            <!-- Text input line -->
            <input type="text" class="book-name-line" id="bookNameInput" placeholder="Enter notebook name..." maxlength="30">
            
            <!-- Error message -->
            <div class="error-message" id="errorMessage">A notebook with this name already exists!</div>
            
            <!-- Book selection grid -->
            <div class="book-selection" id="bookSelection">
                <!-- Book options will be generated by JavaScript -->
            </div>
            
            <!-- Custom buttons -->
            <div class="custom-modal-buttons">
                <button class="custom-button" onclick="createOrUpdateBook()">
                    <img src="Images/ConfirmButton.png" alt="Confirm">
                </button>
                <button class="custom-button" onclick="closeModal()">
                    <img src="Images/CancelButton.png" alt="Cancel">
                </button>
            </div>
        </div>
    </div>

    <!-- Book Action Modal -->
    <div id="bookActionModal" class="modal">
        <div class="book-action-modal-content">
            <div class="book-action-buttons">
                <button class="book-action-button" onclick="editBookNameAndStyle()">
                    <img src="Images/EditBookButton.png" alt="Edit Book">
                </button>
                <button class="book-action-button" onclick="openBookEditor()">
                    <img src="Images/OpenBookButton.png" alt="Open Book">
                </button>
                <button class="book-action-button" onclick="closeBookActionModal()">
                    <img src="Images/CancelButton.png" alt="Cancel">
                </button>
            </div>
        </div>
    </div>

    <!-- Delete confirmation modal - Updated with custom GUI -->
    <div id="deleteModal" class="modal delete-modal">
        <div class="delete-modal-content">
            <!-- Custom buttons -->
            <div class="delete-modal-buttons">
                <button class="delete-modal-button" onclick="confirmDelete()">
                    <img src="Images/ConfirmButton.png" alt="Confirm Delete">
                </button>
                <button class="delete-modal-button" onclick="closeDeleteModal()">
                    <img src="Images/CancelButton.png" alt="Cancel">
                </button>
            </div>
        </div>
    </div>

    <script>
        let books = [];
        let bookCounter = 0;
        let bookToDelete = null;
        let bookToDeleteOriginalPosition = null; // Store original position for restoration
        let selectedBookImage = 'Images/Book1.png'; // Default selection
        let currentBookElement = null; // For tracking which book was clicked
        let bookBeingEdited = null; // SEPARATE variable specifically for editing
        let originalBookName = ''; // Store original name when editing

        // Data persistence functions - Updated for Electron file system
        async function saveAppData() {
            const appData = {
                books: books.map(book => ({
                    id: book.id,
                    name: book.name,
                    image: book.image,
                    x: parseInt(document.querySelector(`[data-book-id="${book.id}"]`).style.left),
                    y: parseInt(document.querySelector(`[data-book-id="${book.id}"]`).style.top),
                    editorData: book.editorData || null
                })),
                bookCounter: bookCounter
            };
            
            try {
                const result = await window.electronAPI.saveNotebookData(appData);
                if (result.success) {
                    console.log('App data saved to file:', appData);
                } else {
                    console.error('Failed to save app data:', result.error);
                }
            } catch (error) {
                console.error('Error saving app data:', error);
            }
        }

        async function loadAppData() {
            try {
                const result = await window.electronAPI.loadNotebookData();
                if (result.success && result.data) {
                    const appData = result.data;
                    books = appData.books || [];
                    bookCounter = appData.bookCounter || 0;
                    
                    // Recreate books on the desktop
                    books.forEach(book => {
                        createBookElement(book);
                    });
                    
                    console.log('App data loaded from file:', appData);
                    return true;
                } else if (result.success && !result.data) {
                    console.log('No saved data file found, starting fresh');
                    return false;
                } else {
                    console.error('Error loading app data:', result.error);
                    return false;
                }
            } catch (error) {
                console.error('Error loading app data:', error);
                return false;
            }
        }

        function createBookElement(bookData) {
            const desktop = document.getElementById('desktop');
            const bookElement = document.createElement('div');
            bookElement.className = 'book';
            bookElement.style.left = bookData.x + 'px';
            bookElement.style.top = bookData.y + 'px';
            bookElement.setAttribute('data-book-id', bookData.id);
            bookElement.setAttribute('data-book-name', bookData.name);

            bookElement.innerHTML = `
                <img src="${bookData.image}" alt="${bookData.name}">
                <div class="book-title">${bookData.name}</div>
            `;

            makeDraggable(bookElement);
            desktop.appendChild(bookElement);
        }

        async function updateBookEditorData(bookId, editorData) {
            const bookIndex = books.findIndex(book => book.id === bookId);
            if (bookIndex !== -1) {
                books[bookIndex].editorData = editorData;
                await saveAppData(); // Auto-save when editor data changes
                console.log(`Editor data updated for book ID ${bookId}`);
            }
        }

        function getBookEditorData(bookId) {
            const book = books.find(book => book.id === bookId);
            return book ? book.editorData : null;
        }

        // Cache a canvas per <img> so we don't redraw every time
const __alphaCanvasCache = new WeakMap();

function ensureAlphaCanvas(imgEl) {
  if (__alphaCanvasCache.has(imgEl)) return __alphaCanvasCache.get(imgEl);
  const c = document.createElement('canvas');
  // If the image isn't loaded yet, bail out safely
  const w = imgEl.naturalWidth, h = imgEl.naturalHeight;
  if (!w || !h) return null;
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(imgEl, 0, 0);
  __alphaCanvasCache.set(imgEl, c);
  return c;
}

/**
 * Returns true if the pixel under (clientX, clientY) is opaque enough.
 * Handles object-fit: contain letterboxing and scaling.
 */
function isOpaqueAtPoint(imgEl, containerEl, clientX, clientY, alphaThreshold = 10) {
  const naturalW = imgEl.naturalWidth, naturalH = imgEl.naturalHeight;
  if (!naturalW || !naturalH) return false; // not ready yet

  const rect = containerEl.getBoundingClientRect();
  const cw = rect.width, ch = rect.height;

  // How the image is drawn inside the container with object-fit: contain
  const scale = Math.min(cw / naturalW, ch / naturalH);
  const drawnW = naturalW * scale;
  const drawnH = naturalH * scale;
  const offsetX = (cw - drawnW) / 2;
  const offsetY = (ch - drawnH) / 2;

  const xInContainer = clientX - rect.left;
  const yInContainer = clientY - rect.top;

  // Outside the drawn image area (letterboxed): definitely transparent
  if (xInContainer < offsetX || yInContainer < offsetY ||
      xInContainer >= offsetX + drawnW || yInContainer >= offsetY + drawnH) {
    return false;
  }

  // Map to source pixel
  const srcX = Math.floor((xInContainer - offsetX) / scale);
  const srcY = Math.floor((yInContainer - offsetY) / scale);

  const c = ensureAlphaCanvas(imgEl);
  if (!c) return false; // image not ready yet

  const ctx = c.getContext('2d', { willReadFrequently: true });
  const a = ctx.getImageData(srcX, srcY, 1, 1).data[3]; // alpha 0..255
  return a >= alphaThreshold;
}

        // Simple hover handler
        function addSimpleHover(element, onHoverStart, onHoverEnd) {
            element.addEventListener('mouseenter', onHoverStart);
            element.addEventListener('mouseleave', onHoverEnd);
        }

        // Generate book selection options
        function generateBookOptions() {
            const bookSelection = document.getElementById('bookSelection');
            bookSelection.innerHTML = '';
            
            for (let i = 1; i <= 15; i++) {
                const bookOption = document.createElement('div');
                bookOption.className = 'book-option';
                bookOption.setAttribute('data-book-image', `Images/Book${i}.png`);
                
                if (i === 1) {
                    bookOption.classList.add('selected'); // Default selection
                }
                
                bookOption.innerHTML = `<img src="Images/Book${i}.png" alt="Book ${i}">`;
                
                bookOption.addEventListener('click', function() {
                    // Remove selection from all options
                    document.querySelectorAll('.book-option').forEach(option => {
                        option.classList.remove('selected');
                    });
                    
                    // Select this option
                    bookOption.classList.add('selected');
                    selectedBookImage = bookOption.getAttribute('data-book-image');
                });
                
                bookSelection.appendChild(bookOption);
            }
        }

        // Check if a book name already exists (excluding the book being edited)
        function isBookNameExists(name, excludeBookId = null) {
            const existingBooks = books.filter(book => 
                book.name.toLowerCase() === name.toLowerCase() && 
                book.id !== excludeBookId
            );
            
            console.log(`Checking if name "${name}" exists:`);
            console.log('Current books:', books.map(b => `${b.name} (ID: ${b.id})`));
            console.log('Matching books:', existingBooks.map(b => `${b.name} (ID: ${b.id})`));
            console.log('Excluding book ID:', excludeBookId);
            console.log('Name exists:', existingBooks.length > 0);
            
            return existingBooks.length > 0;
        }

        // Show error message
        function showErrorMessage(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.classList.add('show');
            
            // Hide error message after 3 seconds
            setTimeout(() => {
                errorElement.classList.remove('show');
            }, 3000);
        }

        // Set up keyboard handling once when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            // Load saved data first
            await loadAppData();
            
            const newBookButton = document.querySelector('.new-book-button');
            
            // Add simple hover effect to new book button
            addSimpleHover(newBookButton,
                function(e) {
                    newBookButton.style.transform = 'scale(1.1) rotate(-25deg)';
                },
                function(e) {
                    newBookButton.style.transform = 'scale(1) rotate(-25deg)';
                }
            );

            // Generate book options
            generateBookOptions();

            // Keyboard handling for the input
            document.getElementById('bookNameInput').addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    createOrUpdateBook();
                }
                if (event.key === 'Escape') {
                    closeModal();
                }
            });

            // Hide error message when typing
            document.getElementById('bookNameInput').addEventListener('input', function() {
                document.getElementById('errorMessage').classList.remove('show');
            });

            // Auto-save when the window is about to close or lose focus
            window.addEventListener('beforeunload', () => {
                saveAppData().catch(console.error);
            });
            window.addEventListener('blur', () => {
                saveAppData().catch(console.error);
            });
        });

        function showBookActionModal(bookElement) {
            const modal = document.getElementById('bookActionModal');
            currentBookElement = bookElement;
            modal.style.display = 'block';
        }

        function closeBookActionModal() {
            document.getElementById('bookActionModal').style.display = 'none';
            currentBookElement = null;
        }

        function editBookNameAndStyle() {
            if (currentBookElement) {
                console.log('=== STARTING EDIT MODE ===');
                console.log('Book to edit:', currentBookElement.getAttribute('data-book-name'));
                
                // Store the book we're editing in a separate variable
                bookBeingEdited = currentBookElement;
                
                // Get current book data
                const currentName = currentBookElement.getAttribute('data-book-name');
                const currentImage = currentBookElement.querySelector('img').src;
                
                // Store original name for comparison
                originalBookName = currentName;
                
                console.log('bookBeingEdited set to:', bookBeingEdited.getAttribute('data-book-name'));
                console.log('originalBookName set to:', originalBookName);
                
                // Set up the name modal with current values
                document.getElementById('bookNameInput').value = currentName;
                
                // Find and select the current book style
                const currentImagePath = currentImage.split('/').pop(); // Get filename
                selectedBookImage = 'Images/' + currentImagePath;
                
                // Update visual selection
                document.querySelectorAll('.book-option').forEach(option => {
                    option.classList.remove('selected');
                });
                const matchingOption = document.querySelector(`[data-book-image="${selectedBookImage}"]`);
                if (matchingOption) {
                    matchingOption.classList.add('selected');
                }
                
                closeBookActionModal();
                showNameModal();
            }
        }

        function openBookEditor() {
            if (currentBookElement) {
                const bookName = currentBookElement.getAttribute('data-book-name');
                const bookId = currentBookElement.getAttribute('data-book-id');
                closeBookActionModal();
                openEditor(bookName, bookId);
            }
            const onOpenClick = () => {
  const bookId = selectedBook.id;     // your selection logic
  const bookName = selectedBook.name; // your selection logic (human name)
  window.electronAPI.openEditor(bookId, bookName);
};
        }

        function showNameModal() {
            const modal = document.getElementById('nameModal');
            const input = document.getElementById('bookNameInput');
            
            modal.style.display = 'block';
            
            // Check if we have bookBeingEdited (means we're editing)
            if (!bookBeingEdited) {
                // CREATING NEW BOOK: Reset everything to defaults
                console.log('=== CREATING NEW BOOK MODE ===');
                input.value = '';
                originalBookName = '';
                selectedBookImage = 'Images/Book1.png';
                document.querySelectorAll('.book-option').forEach(option => {
                    option.classList.remove('selected');
                });
                document.querySelector('.book-option[data-book-image="Images/Book1.png"]').classList.add('selected');
            } else {
                // EDITING EXISTING BOOK: Keep current values (already set by editBookNameAndStyle)
                console.log('=== EDITING BOOK MODE ===');
                console.log('bookBeingEdited:', bookBeingEdited.getAttribute('data-book-name'));
            }
            
            // Hide any error messages
            document.getElementById('errorMessage').classList.remove('show');
            
            input.focus();
        }

        function closeModal() {
            document.getElementById('nameModal').style.display = 'none';
            
            // Only clear the editing state if we're not continuing an edit operation
            // The state will be properly managed by the individual functions
            console.log('closeModal called - bookBeingEdited cleared');
            bookBeingEdited = null;
            originalBookName = '';
            
            // Hide error message
            document.getElementById('errorMessage').classList.remove('show');
        }

        function showDeleteModal(bookElement) {
            const modal = document.getElementById('deleteModal');
            
            // Store the book - the original position is already stored by the drag system
            bookToDelete = bookElement;
            
            // If bookToDeleteOriginalPosition wasn't set by drag (e.g., if called differently), 
            // set it to current position as fallback
            if (!bookToDeleteOriginalPosition) {
                bookToDeleteOriginalPosition = {
                    x: bookElement.offsetLeft,
                    y: bookElement.offsetTop
                };
            }
            
            modal.style.display = 'block';
        }

        function closeDeleteModal() {
            // Restore the book to its original position if cancelling deletion
            if (bookToDelete && bookToDeleteOriginalPosition) {
                bookToDelete.style.left = bookToDeleteOriginalPosition.x + 'px';
                bookToDelete.style.top = bookToDeleteOriginalPosition.y + 'px';
                
                // Update the stored position in the books array
                const bookId = parseInt(bookToDelete.getAttribute('data-book-id'));
                const bookIndex = books.findIndex(book => book.id === bookId);
                if (bookIndex !== -1) {
                    books[bookIndex].x = bookToDeleteOriginalPosition.x;
                    books[bookIndex].y = bookToDeleteOriginalPosition.y;
                    saveAppData().catch(console.error);
                }
            }
            
            document.getElementById('deleteModal').style.display = 'none';
            bookToDelete = null;
            bookToDeleteOriginalPosition = null;
        }

        async function confirmDelete() {
    if (bookToDelete) {
        const bookId = parseInt(bookToDelete.getAttribute('data-book-id'));
        const bookName = bookToDelete.getAttribute('data-book-name');
        
        console.log(`Deleting book: "${bookName}" (ID: ${bookId})`);
        console.log('Books before deletion:', books.map(b => `${b.name} (ID: ${b.id})`));
        
        // Delete the book folder first
        try {
            console.log(`Deleting folder for book: "${bookName}"`);
            const result = await window.electronAPI.deleteBookFolder(bookName);
            if (result.success) {
                console.log('Book folder deleted successfully');
            } else {
                console.error('Failed to delete book folder:', result.error);
                // Continue with book deletion even if folder deletion fails
            }
        } catch (error) {
            console.error('Error deleting book folder:', error);
            // Continue with book deletion even if folder deletion fails
        }
        
        // Remove from books array
        books = books.filter(book => book.id !== bookId);
        
        console.log('Books after deletion:', books.map(b => `${b.name} (ID: ${b.id})`));
        
        // Remove from DOM
        bookToDelete.remove();
        
        // Force save to file immediately
        await saveAppData();
        
        // Clear references
        bookToDelete = null;
        bookToDeleteOriginalPosition = null;
        
        document.getElementById('deleteModal').style.display = 'none';
        
        console.log(`Book "${bookName}" and its folder successfully deleted`);
    }
}

        function isOverGreenSphere(x, y) {
            const greenSphere = document.getElementById('greenSphereTrash');
            const rect = greenSphere.getBoundingClientRect();
            
            // Check if within circular bounds
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const radius = rect.width / 2;
            
            const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
            return distance <= radius;
        }

        async function createOrUpdateBook() {
    const bookName = document.getElementById('bookNameInput').value.trim();
    
    if (bookName === '') {
        showErrorMessage('Please enter a name for your notebook!');
        return;
    }

    console.log('=== createOrUpdateBook called ===');
    console.log('bookBeingEdited:', bookBeingEdited ? bookBeingEdited.getAttribute('data-book-name') : 'null');
    
    if (bookBeingEdited) {
        // *** EDITING MODE *** - Update existing book
        console.log('*** EDITING EXISTING BOOK ***');
        
        const bookId = parseInt(bookBeingEdited.getAttribute('data-book-id'));
        
        // Check for duplicate name (excluding current book)
        if (bookName.toLowerCase() !== originalBookName.toLowerCase() && isBookNameExists(bookName, bookId)) {
            showErrorMessage('A notebook with this name already exists!');
            return;
        }
        
        // Create folder for the updated book name (in case name changed)
        try {
            console.log(`Creating/ensuring folder for updated book: "${bookName}"`);
            const result = await window.electronAPI.createBookFolder(bookName);
            if (result.success) {
                console.log('Book folder created/ensured successfully');
            } else {
                console.error('Failed to create book folder:', result.error);
                showErrorMessage('Failed to create book folder!');
                return;
            }
        } catch (error) {
            console.error('Error creating book folder:', error);
            showErrorMessage('Error creating book folder!');
            return;
        }
        
        // Update the existing book element
        bookBeingEdited.setAttribute('data-book-name', bookName);
        bookBeingEdited.querySelector('img').src = selectedBookImage;
        bookBeingEdited.querySelector('.book-title').textContent = bookName;
        
        // Update the books array
        const bookIndex = books.findIndex(book => book.id === bookId);
        if (bookIndex !== -1) {
            books[bookIndex].name = bookName;
            books[bookIndex].image = selectedBookImage;
        }
        
        console.log(`*** SUCCESSFULLY UPDATED BOOK: ${bookName} (ID: ${bookId}) ***`);
        
        // Auto-save after updating book
        await saveAppData();
        
        // Clear editing state
        bookBeingEdited = null;
        originalBookName = '';
        
    } else {
        // *** CREATING MODE *** - Create new book
        console.log('*** CREATING NEW BOOK ***');
        
        if (isBookNameExists(bookName)) {
            showErrorMessage('A notebook with this name already exists!');
            return;
        }
        
        // Create folder for the new book FIRST
        try {
            console.log(`Creating folder for new book: "${bookName}"`);
            const result = await window.electronAPI.createBookFolder(bookName);
            if (result.success) {
                console.log('Book folder created successfully at:', result.folderPath);
            } else {
                console.error('Failed to create book folder:', result.error);
                showErrorMessage('Failed to create book folder!');
                return;
            }
        } catch (error) {
            console.error('Error creating book folder:', error);
            showErrorMessage('Error creating book folder!');
            return;
        }
        
        // Create new book
        const bookImageSrc = selectedBookImage;

        // Generate random position (avoiding edges)
        const desktop = document.getElementById('desktop');
        const maxX = window.innerWidth - 200;
        const maxY = window.innerHeight - 260;
        
        const randomX = Math.floor(Math.random() * (maxX - 20)) + 20;
        const randomY = Math.floor(Math.random() * (maxY - 20)) + 20;

        // Create book element
        const bookElement = document.createElement('div');
        bookElement.className = 'book';
        bookElement.style.left = randomX + 'px';
        bookElement.style.top = randomY + 'px';
        bookElement.setAttribute('data-book-id', bookCounter);
        bookElement.setAttribute('data-book-name', bookName);

        bookElement.innerHTML = `
            <img src="${bookImageSrc}" alt="${bookName}">
            <div class="book-title">${bookName}</div>
        `;

        // Make book draggable
        makeDraggable(bookElement);

        desktop.appendChild(bookElement);

        // Store book data
        books.push({
            id: bookCounter,
            name: bookName,
            image: bookImageSrc,
            x: randomX,
            y: randomY,
            editorData: null // Initialize with no editor data
        });

        console.log(`*** SUCCESSFULLY CREATED NEW BOOK: ${bookName} (ID: ${bookCounter}) ***`);
        bookCounter++;
        
        // Auto-save after creating book
        await saveAppData();
    }
    
    closeModal();
}

            createOrUpdateBook();

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let isDragging = false;
            let dragStartTime = 0;
            let originalPosition = { x: 0, y: 0 }; // Store original position
            const greenSphere = document.getElementById('greenSphereTrash');
            const trashCan = document.getElementById('trashCan');
            
            element.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                
                dragStartTime = Date.now();
                isDragging = false;
                
                // Store original position at the start of dragging
                originalPosition.x = element.offsetLeft;
                originalPosition.y = element.offsetTop;
                
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                
                // Add dragging class for visual feedback
                element.classList.add('dragging');
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                
                isDragging = true;
                
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                let newTop = element.offsetTop - pos2;
                let newLeft = element.offsetLeft - pos1;
                
                // Keep within bounds - updated for larger book size
                if (newTop < 0) newTop = 0;
                if (newLeft < 0) newLeft = 0;
                if (newTop > window.innerHeight - 240) newTop = window.innerHeight - 240;
                if (newLeft > window.innerWidth - 180) newLeft = window.innerWidth - 180;
                
                element.style.top = newTop + "px";
                element.style.left = newLeft + "px";
                
                // Check if over green sphere (which acts as trash)
                if (isOverGreenSphere(e.clientX, e.clientY)) {
                    greenSphere.classList.add('drag-over');
                    trashCan.classList.add('drag-over');
                } else {
                    greenSphere.classList.remove('drag-over');
                    trashCan.classList.remove('drag-over');
                }
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                
                // Remove dragging class
                element.classList.remove('dragging');
                greenSphere.classList.remove('drag-over');
                trashCan.classList.remove('drag-over');
                
                // Auto-save position after dragging
                if (isDragging) {
                    const bookId = parseInt(element.getAttribute('data-book-id'));
                    const bookIndex = books.findIndex(book => book.id === bookId);
                    if (bookIndex !== -1) {
                        books[bookIndex].x = parseInt(element.style.left);
                        books[bookIndex].y = parseInt(element.style.top);
                        saveAppData().catch(console.error);
                    }
                }
                
                // Check if dropped on green sphere
                const dragDuration = Date.now() - dragStartTime;
                if (isDragging && dragDuration >= 200) {
                    const rect = element.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    
                    if (isOverGreenSphere(centerX, centerY)) {
                        // Store the original position before showing delete modal
                        bookToDeleteOriginalPosition = {
                            x: originalPosition.x,
                            y: originalPosition.y
                        };
                        showDeleteModal(element);
                        return;
                    }
                }
                
                // If it wasn't dragged (just a click), show book action modal
                if (!isDragging || dragDuration < 200) {
                    showBookActionModal(element);
                }
                
                isDragging = false;
            }
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            // Reposition books if they're outside viewport - updated for larger book size
            const books = document.querySelectorAll('.book');
            books.forEach(book => {
                const rect = book.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    book.style.left = (window.innerWidth - 180) + 'px';
                }
                if (rect.bottom > window.innerHeight) {
                    book.style.top = (window.innerHeight - 240) + 'px';
                }
            });
        });
    </script>
