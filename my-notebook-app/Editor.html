<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('Images/Desk.png') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            overflow: hidden;          /* <- disables page scrolling */
            overscroll-behavior: none; /* <- stops rubber-band/bounce */
        }
        

        .sidebar {
    width: 250px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* was: space-evenly */
    gap: 1rem;                   /* nicer spacing */
    overflow: hidden;
}



        .title {
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'Biro Script Plus';
        }

        .toolbar {
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;  /* spreads top-to-bottom */
    flex: 1;                          /* make toolbar take all sidebar height */
}

        .btn {
            background: transparent;
            border: 1px transparent;
            color: black;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.0rem;
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
            font-family: 'Biro Script Plus';
        }

        .btn:hover {
            transform: translateX(5px);
        }

        .font-selector {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            width: 100%;
        }

        .font-selector option {
            background: #333;
            color: white;
        }

        .main-container {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: stretch;
            padding: 2rem;
            gap: .5rem;
        }

        .book-container {
            background: transparent;
            border-radius: 15px;
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: visible;
            position: relative;
        }

        .tools-panel {
          background: url('Images/ToolsPaper.png') center/cover no-repeat;
            border-radius: 15px;
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transform: rotate(3deg) scale(1) translate(0px, 0px);
        }

        .tools-header {
            background: transparent;
            padding: 0.5rem 1rem;
            text-align: center;
            font-weight: 600;
            color: #495057;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Biro Script Plus', cursive;
        }

        .tools-content {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
        }

        .tool-section {
            margin-bottom: 2rem;
        }

        .tool-section h3 {
    color: #495057;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid black;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Biro Script Plus';
    width: 90%;
}

        .tool-section .tool-item {
            margin-bottom: 0.75rem;
        }

        .tool-section label {
            display: block;
            color: black;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            font-weight: 500;
            font-family: 'Biro Script Plus';
        }

        .tools-font-selector {
            background: transparent;
            color: black;
            padding: 0.5rem;
            border-radius: 6px;
            width: 100%;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
            font-family: 'Biro Script Plus';
        }
        #brushSizeValue {
  font-family: 'Biro Script Plus';
  font-size: 0.8rem;
  white-space: nowrap;
}

        .tools-font-selector:focus {
            outline: none;
            border-color: #007bff;
        }

        .tools-font-selector option {
            background: white;
            color: #495057;
        }

        .tool-placeholder {
            color: #999;
            font-style: italic;
            font-size: 0.9rem;
            padding: 1rem;
            text-align: center;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px dashed #ddd;
            font-family: 'Biro Script Plus';
        }

        .page-header {
    background: transparent;
    padding: 0.25rem 0.5rem; /* thinner bar */
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 36px;        /* thinner bar */
}

        .page-nav {
    display: flex;
    gap: 0.25rem;
    align-items: center;
    flex-wrap: nowrap;
    /* Use padding-left instead if you prefer: */
    padding-left: 1rem;  /* Adjust this value as needed */
}

        .page-nav button {
    background: transparent;
    color: black;
    border: none;
    padding: 0.25rem 0.5rem; /* smaller */
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.8rem;       /* smaller text */
    font-family: 'Biro Script Plus';
    line-height: 1;
    white-space: nowrap;
}

        .page-nav button:hover:not(:disabled) {
    background: transparent;
    transform: translateY(-1px);
}

        .page-nav button:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
    opacity: 0.3;
    color: rgba(255, 255, 255, 0.6);  /* Also fade the text color */
}

        .toc-btn {
    background: #007bff;
    color: white;
    border: none;
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.8rem;
    font-family: 'Biro Script Plus';
    line-height: 1;
    white-space: nowrap;
}

        .toc-btn:hover {
    background: #0056b3;
    transform: translateY(-1px);
}

        .page-counter {
            font-weight: 600;
            color: #495057;
        }

        .editor {
  height: 100%;
  padding: 2rem;
  overflow-y: auto;
  overflow-x: hidden;        /* hides horizontal scrollbars */
  font-size: 16px;
  line-height: 1.6;
  position: relative;

  word-wrap: break-word;     /* break long words at edges */
  overflow-wrap: anywhere;   /* modern: break anywhere if needed */
}

        .editor:focus {
            outline: none;
        }

        .page-number {
            position: absolute;
            bottom: 1rem;
            right: 2rem;
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Biro Script Plus';
        }

        .toc-page {
            padding: 2rem;
        }

        .toc-title {
            font-size: 2rem;
            font-family: 'Biro Script Plus';
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
            border-bottom: 3px solid black;
            padding-bottom: 1rem;
        }

        .toc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            margin: 0.5rem 0;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toc-item:hover {
            background: transparent;
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .toc-chapter {
            font-weight: 600;
            color: black;
        }

        .toc-page-num {
            background: transparent;
            color: black;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: 'Biro Script Plus';
        }

        .canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            border: none;
            background: transparent;
        }

        .canvas-overlay.drawing-active {
    pointer-events: all;
    cursor: crosshair !important;   /* force crosshair */
    caret-color: transparent !important; /* hide text caret */
}

        .drawing-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .drawing-controls button,
.drawing-controls-inline button {
    background: transparent;
    color: black;
    border: 1px solid black;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9rem;
    font-family: 'Biro Script Plus';
}
.drawing-controls button:hover,
.drawing-controls-inline button:hover {
    background: lightgrey;
}

.drawing-controls button.active,
.drawing-controls-inline button.active {
    background: lightgrey;
}

        .drawing-controls button:hover {
            background: #0056b3;
        }

        .drawing-controls button.active {
            background: #28a745;
        }

        .drawing-controls-inline {
  display: flex;
  align-items: center;
  gap: 0.5rem; /* spacing between buttons */
  margin-bottom: 1rem;
}

        .drawing-color-picker {
  width: 32px;   /* small square */
  height: 32px;
  padding: 0;
  border: none;
  cursor: pointer;
}

        .drawing-size-control {
            width: 100%;
            margin: 0.5rem 0;
        }

        .drawing-size-control input {
            width: 100%;
        }

        .chapter-marker {
            background: #28a745;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            margin: 1rem 0;
            display: block;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            margin: 10px;
            user-select: none;
        }

        .image-wrapper.selected {
            outline: 3px solid #007bff;
            outline-offset: 2px;
        }

        .image-wrapper img,
.image-wrapper video {
    display: block;
    max-width: 100%;
    height: auto;
    border: 2px solid #ddd;
    border-radius: 8px;
    cursor: move;
}

        .image-controls {
            position: absolute;
            top: -40px;
            right: -10px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 5px;
            display: none;
            gap: 5px;
            align-items: center;
        }

        .image-wrapper.selected .image-controls {
            display: flex;
        }

        .image-controls button {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-family: 'Biro Script Plus';
            transition: background 0.2s;
        }

        .image-controls button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .resize-handle {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background: #007bff;
            border-radius: 50%;
            cursor: se-resize;
            display: none;
        }

        .image-wrapper.selected .resize-handle {
            display: block;
        }

        .rotation-handle {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #28a745;
            border-radius: 50%;
            cursor: grab;
            display: none;
        }

        .image-wrapper.selected .rotation-handle {
            display: block;
        }

        .image-wrapper,
.image-wrapper *,
.polaroid,
.polaroid *,
.video-polaroid,
.video-polaroid *,
.image-controls,
.image-controls *,
.resize-handle,
.rotation-handle {
    user-select: none !important;
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    pointer-events: auto;
}

.image-wrapper .frame,
.image-wrapper .photo,
.image-wrapper img,
.image-wrapper video {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

/* Cursor styles for image elements */
.image-wrapper {
    cursor: pointer;
}

.image-wrapper:hover {
    cursor: move;
}

.image-wrapper.selected {
    cursor: move;
}

.image-wrapper .polaroid,
.image-wrapper .video-polaroid,
.image-wrapper img,
.image-wrapper video,
.image-wrapper .frame,
.image-wrapper .photo {
    cursor: move !important;
}

.image-wrapper .resize-handle {
    cursor: se-resize !important;
}

.image-wrapper .rotation-handle {
    cursor: grab !important;
}

.image-wrapper .rotation-handle:active {
    cursor: grabbing !important;
}

.image-wrapper .image-controls {
    cursor: default !important;
}

.image-wrapper .image-controls button {
    cursor: pointer !important;
}

/* Override any text cursor that might be inherited */
.image-wrapper *:not(.image-controls button) {
    cursor: inherit !important;
}

        .rotation-handle:active {
            cursor: grabbing;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }

            .book-container {
                height: 500px;
            }

            .toolbar {
                justify-content: center;
            }
        }

        .entry-title-line,
.entry-date-line {
  border-bottom: 2px solid black;  /* underline */
  padding-bottom: 0.25rem;
  margin: 0.5rem 0 0.75rem 0;
  min-height: 1.75em;                /* easy to click/type */
}

.entry-title-line {
  font-size: 1.4rem;
  font-weight: 600;
  max-width: 70%;
}

.entry-date-line {
  font-size: 0.95rem;
  color: black;
  max-width: 16rem;                   /* shorter line for date */
}

/* optional: give body some space from the header lines */
.page-body {
  margin-top: 1rem;
  min-height: 300px;   /* makes the area clickable */
  cursor: text;
}
        
/* Chapter tabs */
.chapter-tabs {
  position: absolute;
  top: -25px;          /* tweak to taste */
  left: 40px;        /* tweak to taste */
  display: flex;
  gap: 6px;
  z-index: 5;        /* above page header */
  pointer-events: auto;
}

.chapter-tab {
  background: #fff9c4;
  border: 1px solid #d4c35a;
  border-bottom: 2px solid #b9a846;
  padding: 4px 10px;
  font-size: 12px;
  font-family: 'Biro Script Plus';
  line-height: 1;
  border-top-left-radius: 6px;
  border-top-right-radius: 6px;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
  white-space: nowrap;

  /* new: make room & position for the close icon */
  position: relative;
  padding-right: 22px;
}

.chapter-tab:hover {
  transform: translateY(-2px);
  background: #fff59d;
}

/* small close (x), only visible on hover */
.chapter-tab .close {
  position: absolute;
  right: 6px;
  top: 4px;
  font-weight: 700;
  opacity: 0;
  transition: opacity .15s ease;
  cursor: pointer;
  user-select: none;
  line-height: 1;
}

.chapter-tab:hover .close {
  opacity: 1;
}

/* Outer frame that holds BOTH panels */
.notebook-frame {
  position: relative;
  width: min(1200px, 95vw);
  height: clamp(800px, 95vh, 1300px);
  margin: 0 auto;
  border-radius: 18px;
  background: url('Images/BookPages.png') center/100% 100% no-repeat; /* starter tint; swap to image later */
  backdrop-filter: blur(6px);
  padding: 16px;     /* inner gutter around the spread */
  overflow: visible; /* lets tabs/accents poke out if needed */
}

/* Row containing the book and tools panel */
.spread {
  display: flex;
  gap: .5rem;
  width: 100%;
  height: 100%;
  align-items: stretch;
}

/* Let both panels fill the frame vertically */
.book-container,
.tools-panel {
  height: 100%;
  max-width: none;
  flex: 1 1 0;
}
.font-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap; /* ensures it doesn't break if too narrow */
}

.font-size-selector {
  max-width: 65px;
}

.format-btn {
  background: transparent;
  border: 1px solid black;
  border-radius: 4px;
  padding: 0.25rem 0.5rem;
  cursor: pointer;
  font-size: 1rem;
  font-family: 'Biro Script Plus';
  transition: background 0.2s ease;
}

.format-btn:hover {
  background: #e0e0e0;
}
.format-btn.list-btn {
  font-size: 0.9rem;
  font-weight: 600;
  font-family: 'Biro Script Plus';
}

.highlight-control {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex: 1;   /* let it size evenly like other buttons */
}

.highlight-dropdown {
  background: transparent;
  border: 1px solid black;
  border-radius: 4px;
  padding: 0.25rem 0.5rem;
  cursor: pointer;
  font-size: 0.9rem;
  font-family: 'Biro Script Plus';
}

.swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,.2);
  margin-right: 6px;
  vertical-align: -2px;
  background: #fff59d; /* default */
}

.hidden-color {
  /* visually hidden but still clickable via .click() */
  position: absolute;
  left: -9999px;
  width: 0; height: 0; border: 0; padding: 0; margin: 0;
}
.drawing-cursor {
  position: fixed;
  width: 8px;   /* circle size */
  height: 8px;
  background: black;
  border-radius: 50%;
  pointer-events: none; /* so it never blocks clicks */
  z-index: 2000;        /* above everything */
  display: none;        /* hidden by default */
}

/* Polaroid frame (image overlay + inner photo area) */
.polaroid {
  position: relative;
  display: inline-block;
  width: 260px;                 /* JS resizes this; height comes from aspect-ratio */
  border-radius: 6px;
  user-select: none;
  /* default paddings for the inner photo area */
  --pad-side: 5%;
  --pad-top: 17%;
  --pad-bottom: 15%;            /* leave a little extra for the polaroid “lip” */
}

/* The actual picture, placed inside the frame window */
/* The actual picture, placed inside the frame window */
.polaroid .photo {
  position: absolute;
  left: max(10%, var(--pad-side));   /* ≥10% sides */
  right: max(10%, var(--pad-side));
  top: var(--pad-top);               /* ~17% if that's your variable */
  bottom: var(--pad-bottom);         /* keep bottom padding */
  border-radius: 4px;
  background-size: contain;          /* show entire image, no crop */
  background-position: center;
  background-repeat: no-repeat;
  pointer-events: none;
}

/* PNG frame overlay that sits on top */
.polaroid .frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;          /* match container aspect ratio */
  pointer-events: none;         /* don’t block clicks/drags */
  user-select: none;
}

/* Optional caption (if you want to keep it) */
.polaroid .caption {
  position: absolute;
  left: 0; right: 0;
  bottom: 6px;
  text-align: center;
  font-family: "Comic Sans MS", "Segoe Script", cursive;
  font-size: 0.9rem;
  color: #333;
  opacity: 0.85;
  pointer-events: none;
  font-family: 'Biro Script Plus';
}

.polaroid .frame { z-index: 1; }
.polaroid .photo { z-index: 2; }

.popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
}


.popup-box {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    min-width: 300px;
}

.popup-input {
    width: 100%;
    padding: 0.75rem;
    margin: 1rem 0;
    border: 2px solid #e9ecef;
    border-radius: 6px;
    font-size: 1rem;
    font-family: 'Biro Script Plus';
}

.popup-buttons {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
}

.popup-btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: 'Biro Script Plus';
}

.popup-btn.cancel {
    background: transparent;
    color: white;
}

.popup-btn.ok {
    background: transparent;
    color: white;
}

/* Remove gray border from Polaroid pieces */
.image-wrapper .frame { border: 0 !important; border-radius: 0; box-shadow: none; }
.image-wrapper .polaroid .photo { border: 0 !important; box-shadow: none; }

/* If the blue selection outline bugs you too, kill it: */
.image-wrapper.selected { outline: none; }


.lightbox-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000; padding: 2rem;
}
.lightbox-content { position: relative; max-width: 95vw; max-height: 95vh; }
.lightbox-img, .lightbox-video {
  max-width: 95vw; max-height: 95vh; display: block;
  border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
.lightbox-close {
  position: absolute; top: -12px; right: -12px;
  background: #000; color: #fff; border: none; border-radius: 999px;
  width: 36px; height: 36px; font-size: 20px; line-height: 36px; text-align: center;
  font-family: 'Biro Script Plus';
  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.lightbox-close:hover { background: #333; }

@font-face {
  font-family: 'Biro Script Plus';
  src: url('biro_script/Biro_Script_reduced.woff2') format('woff2'),
       url('biro_script/Biro_Script_reduced.woff') format('woff'),
       url('biro_script/Biro_Script_reduced.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

@font-face {
  font-family: 'Lazy Dog';
  src: url('lazy-dog/lazy_dog.ttf') format('truetype'),
}

.compact-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.compact-row label {
  font-size: 0.8rem;
  white-space: nowrap;
  font-family: 'Biro Script Plus';
}
.compact-row input[type="range"] {
  flex: 1;
  min-width: 70px;
  max-width: 80px;
}

/* Compact rows keep items side by side */
.compact-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.compact-row label {

function resolveMediaPathsForPage(bookFolder) {
  if (!bookFolder) return;

  // Build correct file:// prefix (Windows needs the extra slash)
  const isWindowsPath = /^[A-Za-z]:/.test(bookFolder);
  const prefix = `file://${isWindowsPath ? '/' : ''}${bookFolder.replace(/\\/g, '/')}/`;

  const editor = document.getElementById('editor');
  if (!editor) return;

  // <img> and <video>
  editor.querySelectorAll('img, video').forEach(el => {
    const src = el.getAttribute('src') || '';
    if (src.startsWith('media/')) {
      el.setAttribute('src', encodeURI(prefix + src));
    }
  });

  // .polaroid .photo (background-image + optional data-src)
  editor.querySelectorAll('.polaroid .photo').forEach(div => {
    const bg = div.style.backgroundImage || '';
    // NOTE: single backslashes in the regex literal are correct
    const m = bg.match(/url\(["']?(media\/[^"')]+)["']?\)/);
    if (m) {
      div.style.backgroundImage = `url("${encodeURI(prefix + m[1])}")`;
    }

    const ds = div.getAttribute('data-src') || '';
    if (ds.startsWith('media/')) {
      div.setAttribute('data-src', encodeURI(prefix + ds));
    }
  });
}


function getPhotoEl(wrapper) {

function getPhotoState(wrapper) {
  const d = wrapper.dataset || {};
  return {
    scale:   d.photoScale   ? parseFloat(d.photoScale)   : 100,  // %
    offsetX: d.photoOffsetX ? parseFloat(d.photoOffsetX) : 0,    // px
    offsetY: d.photoOffsetY ? parseFloat(d.photoOffsetY) : 0     // px
  };
}

function applyPhotoState(wrapper, state) {
  const photo = getPhotoEl(wrapper);
  if (!photo) return;
  // Persist
  wrapper.dataset.photoScale   = String(state.scale);
  wrapper.dataset.photoOffsetX = String(state.offsetX);
  wrapper.dataset.photoOffsetY = String(state.offsetY);
  // Render
  photo.style.backgroundSize      = `${Math.max(10, state.scale)}% auto`;
  photo.style.backgroundPosition  = `${state.offsetX}px ${state.offsetY}px`;
  // Ensure it can move within frame cleanly
  photo.style.backgroundRepeat    = 'no-repeat';
  // Save
  saveCurrentPage();

        // Apply inline formatting while preserving the user's selection
let __lastRange = null;

function formatText(cmd) {
  const editor = document.getElementById('editor');

  // Restore last selection if the toolbar click shifted focus
  const sel = window.getSelection();
  if (__lastRange) {
    sel.removeAllRanges();
    sel.addRange(__lastRange);
  }

  editor.focus();
  document.execCommand(cmd, false, null); // 'bold' | 'italic' | 'underline' | 'insertUnorderedList'
  saveCurrentPage();

  // Save the new selection range for subsequent clicks
  if (sel && sel.rangeCount > 0) {
    __lastRange = sel.getRangeAt(0).cloneRange();
  }
}


        function ensurePageScaffold() {
  const editor = document.getElementById('editor');
  if (!editor) return;

  // 🚫 Do nothing on TOC
  if (pages?.[currentPageIndex]?.isTOC || editor.querySelector('.toc-page')) {
    return;
  }

  let title = editor.querySelector('.entry-title-line');
  let date  = editor.querySelector('.entry-date-line');
  let body  = editor.querySelector('.page-body');

  if (!title) {
    title = document.createElement('div');
    title.className = 'entry-title-line';
    title.innerHTML = '';
    editor.insertAdjacentElement('afterbegin', title);
  }

  if (!date) {
    date = document.createElement('div');
    date.className = 'entry-date-line';
    date.innerHTML = ''; // keep space for date (blank line)
    title.insertAdjacentElement('afterend', date);
  }

  if (!body) {
    body = document.createElement('div');
    body.className = 'page-body';
    body.innerHTML = `<p style="line-height: ${globalFormatting.lineHeight}"><br></p>`;
    editor.appendChild(body);
  }

  // Enforce order: title → date → body
  if (title.nextElementSibling !== date) editor.insertBefore(date, body);
  if (date.nextElementSibling !== body)  editor.insertBefore(body, date.nextElementSibling);
}

        // No-scroll (fixed page) mode: stop inserting when caret would go past bottom
(function(){
  const checkbox = document.getElementById("disable-scroll");
  const editor   = document.getElementById("editor");


  function setNoScrollMode(on) {
    editor.style.overflowY = on ? "hidden" : "auto";
    editor.dataset.noScroll = on ? "1" : "0";
  }
    // Force startup state based on the checkbox
  setNoScrollMode(checkbox.checked);

  function isInsertInputType(type) {
    return [
      "insertText","insertParagraph","insertLineBreak",
      "insertFromPaste","insertFromDrop","insertReplacementText","insertFromYank"
    ].includes(type);
  }

  function caretWouldOverflow() {
    // Measure caret line against editor bottom using a temporary zero-width marker
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return false;

    const range = sel.getRangeAt(0).cloneRange();
    const marker = document.createElement("span");
    marker.textContent = "\u200B";           // zero-width space
    marker.style.display = "inline-block";
    range.insertNode(marker);

    const markerRect = marker.getBoundingClientRect();
    marker.parentNode.removeChild(marker);

    const edRect = editor.getBoundingClientRect();
    const buffer = 30;                         // a few px tolerance
    return markerRect.bottom > (edRect.bottom - buffer);
  }

  function flashBottomEdge() {
    editor.style.boxShadow = "inset 0 -6px 0 0 #dc3545";
    setTimeout(() => (editor.style.boxShadow = ""), 180);
  }

  checkbox.addEventListener("change", function () {
    setNoScrollMode(this.checked);
  });

  editor.addEventListener("beforeinput", (e) => {
    if (editor.dataset.noScroll !== "1") return;
    if (!isInsertInputType(e.inputType)) return; // allow deletions etc.

    // Block only if the caret is already at/beyond the visible bottom
    if (caretWouldOverflow()) {
      e.preventDefault();
      flashBottomEdge();
    }
  });
})();



        function getSelectedImageWrapper() {
  return document.querySelector('.image-wrapper.selected');
}
function getImageTarget(wrapper) {
  return wrapper?.querySelector('.polaroid .photo')
      || wrapper?.querySelector('img:not(.frame), video')

// Defaults if no settings saved
function getImageSettings(wrapper) {
  const d = wrapper?.dataset || {};
  return {
    opacity:   d.opacity   ? parseFloat(d.opacity)   : 1,
    saturation:d.saturation? parseInt(d.saturation)  : 100,
    warmth:    d.warmth    ? parseInt(d.warmth)      : 0,
    bw:        d.bw === '1',
    vintage:   d.vintage === '1'
  };
}
function setImageSettings(wrapper, s) {
  const d = wrapper.dataset;
  d.opacity    = String(s.opacity);
  d.saturation = String(s.saturation);
  d.warmth     = String(s.warmth);
  d.bw         = s.bw ? '1' : '0';
  d.vintage    = s.vintage ? '1' : '0';
}

// Build CSS filter chain from settings
function buildFilterFromSettings(s) {
  const filters = [];
  // base
  filters.push(`saturate(${Math.max(0, s.saturation)}%)`);

  // warmth: small sepia + hue shift + brightness
  if (s.warmth !== 0) {
    const w = Math.max(-100, Math.min(100, s.warmth));
    const sep = Math.abs(w) * 0.4;            // 0–40%
    const hue = w > 0 ? -10 : 10;             // warm tilt vs cool tilt
    const brt = 100 + w * 0.15;               // ±15%
    filters.push(`sepia(${sep}%) hue-rotate(${hue}deg) brightness(${brt}%)`);
  }

  if (s.bw) filters.push('grayscale(100%)');

  // vintage preset (stackable)
  if (s.vintage) filters.push('sepia(35%) contrast(90%) brightness(105%) saturate(120%)');

  return filters.join(' ');
}

function applyImageSettings(wrapper, s) {
  const target = getImageTarget(wrapper);
  if (!target) return;

  // Opacity applies to the visual node only (not the controls)
  target.style.opacity = String(s.opacity);

  // Filters apply to the same target (works on div.photo with background)
  target.style.filter = buildFilterFromSettings(s);

  setImageSettings(wrapper, s);
  saveCurrentPage();
}

// UI ↔ settings sync
function imgControlsSyncToUI(wrapper) {
  const s = getImageSettings(wrapper);
  const $ = (id) => document.getElementById(id);

  if ($('imgOpacity'))   $('imgOpacity').value   = Math.round(s.opacity * 100);
  if ($('imgSaturation'))$('imgSaturation').value= s.saturation;

        function applyImportedNotebook(data) {
  // Basic shape validation
  if (!data || typeof data !== 'object') {
    alert('Import failed: file is not a valid object.');
    return;
  }
  if (!Array.isArray(data.pages)) {
    alert('Import failed: missing "pages" array.');
    return;
  }
  if (!Array.isArray(data.chapters)) {
    alert('Import failed: missing "chapters" array.');
    return;
  }

  // Pull fields with safe defaults
  const importedPages = data.pages.map(p => ({
    content: typeof p.content === 'string' ? p.content : '',
    isTOC: !!p.isTOC,
    drawings: Array.isArray(p.drawings) ? p.drawings : []
  }));

  const importedChapters = data.chapters.map(ch => ({
    title: (ch && typeof ch.title === 'string') ? ch.title : 'Untitled',
    page: (ch && Number.isFinite(ch.page)) ? ch.page : 1,
    id: (ch && (typeof ch.id === 'number' || typeof ch.id === 'string')) ? ch.id : Date.now()
  }));

  let importedCurrentPage = Number.isFinite(data.currentPage)
  ? data.currentPage
  : (importedPages.length > 1 ? 1 : 0);
  const importedFormatting = (data.globalFormatting && typeof data.globalFormatting === 'object')
  ? {
      fontFamily: (function(ff){
        // If the saved file still has the old default, upgrade it to Biro
        if (!ff || /Segoe UI/.test(ff)) return "'Biro Script Plus', cursive";
        return ff;
      })(data.globalFormatting.fontFamily),
      fontSize: data.globalFormatting.fontSize || "16px",
      lineHeight: data.globalFormatting.lineHeight || "1.6"
    }
  : { fontFamily: "'Biro Script Plus', cursive", fontSize: "16px", lineHeight: "1.6" };

  // Ensure there is at least one page
  if (importedPages.length === 0) {
    importedPages.push({ content: '', isTOC: false, drawings: [] });
  }

  // Ensure page 0 exists and is TOC; regenerate its content from chapters
  if (!importedPages[0] || importedPages[0].isTOC !== true) {
    importedPages.unshift({ content: '', isTOC: true, drawings: [] });
  }
  // Normalize chapter page numbers into valid range after possible unshift
  importedChapters.forEach(ch => {
    if (!Number.isFinite(ch.page)) ch.page = 1;
    ch.page = Math.max(1, Math.min(ch.page, importedPages.length));
  });

  // Set globals
  pages = importedPages;
  chapters = importedChapters;
  globalFormatting = importedFormatting;
  const fontSel = document.querySelector('.tools-font-selector');
if (fontSel) fontSel.value = globalFormatting.fontFamily;
try { window.__saveCurrentBook__ && window.__saveCurrentBook__(); } catch {}

  // Rebuild TOC page from current chapters
  pages[0].content = generateTOCContent();

  // Clamp current page
  importedCurrentPage = Math.max(0, Math.min(importedCurrentPage, pages.length - 1));
  currentPageIndex = importedCurrentPage;

  // Exit drawing mode if it was on
  if (isDrawingMode) {
    isDrawingMode = false;
    const toggleBtn = document.getElementById('drawingToggle');
    const canvas = document.getElementById('drawingCanvas');
    const editor = document.getElementById('editor');
    if (canvas) canvas.classList.remove('drawing-active');
    if (toggleBtn) {
      toggleBtn.textContent = '✏️ Start Drawing';
      toggleBtn.classList.remove('active');
    }
    if (editor) {
      editor.contentEditable = 'true';
      editor.style.userSelect = 'text';
      editor.style.caretColor = '';
    }
    const cursor = document.getElementById('drawingCursor');
    if (cursor) cursor.style.display = 'none';
  }

  // Refresh UI
  applyGlobalFormatting();   // set font/spacing on container + nodes
  loadPage();                // renders content + drawings for current page
  updatePageCounter();
  renderChapterTabs();
  ensureCanvasSetup();

  // Ensure canvas matches new page size & redraw strokes once more
  setTimeout(() => {
    const editor = document.getElementById('editor');
    const canvas = document.getElementById('drawingCanvas');
    if (editor && canvas) {
      const parentRect = editor.parentElement.getBoundingClientRect();
      canvas.width = parentRect.width;
      canvas.height = parentRect.height;
      canvas.style.width = parentRect.width + 'px';
      canvas.style.height = parentRect.height + 'px';
      drawingStrokes = pages[currentPageIndex].drawings || [];
      redrawAllStrokes();
    }
  }, 50);
}

function applyHighlight() {
  const editor = document.getElementById('editor');
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return; // no selection

  // Only proceed if the selection is inside the editor
  const anchorNode = sel.anchorNode && (sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode);
  if (!editor.contains(anchorNode)) return;

  const range = sel.getRangeAt(0);
  const parentEl = range.commonAncestorContainer.nodeType === 1
      ? range.commonAncestorContainer
      : range.commonAncestorContainer.parentElement;

  // Toggle: if selection already highlighted with same color -> clear, else apply
  const alreadyHighlighted =
    parentEl &&
    parentEl.tagName === 'SPAN' &&
    (parentEl.style.backgroundColor &&
     parentEl.style.backgroundColor !== '' &&
     parentEl.style.backgroundColor !== 'transparent');

  if (alreadyHighlighted) {
    document.execCommand(highlightCommand, false, 'transparent');
  } else {
    document.execCommand(highlightCommand, false, currentHighlightColor);
  }

  editor.focus();
}

function clearHighlight() {
  const editor = document.getElementById('editor');

  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const anchorNode = sel.anchorNode && (sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode);

async function deletePage() {
  // ---- Shared styles (inject once) ----
  function ensurePopupStyles() {
    if (document.getElementById('toc-popup-styles')) return;
    const s = document.createElement('style');

  // ---- Simple OK popup (replaces alert) ----
  function showPopup(message) {
    ensurePopupStyles();
    const overlay = document.createElement('div');
    overlay.className = 'toc-popup-overlay';
    overlay.innerHTML = `
      <div class="toc-popup" role="dialog" aria-modal="true">

    overlay.querySelector('.toc-ok').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    window.addEventListener('keydown', function esc(e){ if (e.key === 'Escape') { close(); window.removeEventListener('keydown', esc);} });
  }

  // ---- Confirm popup (replaces confirm) ----
  function showDeletePagePopup() {
    return new Promise((resolve) => {
      ensurePopupStyles();
      const overlay = document.createElement('div');
      overlay.className = 'toc-popup-overlay';
      overlay.innerHTML = `
        <div class="toc-popup" role="dialog" aria-modal="true">
          <img src="Images/Popup.png" alt="" class="toc-popup-bg">
          <div class="toc-popup-body">
            <p>Are you sure you want to <br> delete this page?</p>
            <div class="popup-buttons">
              <button class="popup-btn cancel" style="background:transparent;border:none;font-family:'Biro Script Plus',cursive;font-size:22px;color:#222;cursor:pointer;">Cancel</button>
<button class="popup-btn ok" style="background:transparent;border:none;font-family:'Biro Script Plus',cursive;font-size:22px;color:#222;cursor:pointer;">Delete</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const cleanup = (result) => { overlay.remove(); resolve(result); };
      overlay.querySelector('.cancel').addEventListener('click', () => cleanup(false));
      overlay.querySelector('.ok').addEventListener('click', () => cleanup(true));
      overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(false); });
      window.addEventListener('keydown', function esc(e){ if (e.key === 'Escape') { cleanup(false); window.removeEventListener('keydown', esc);} });
    });
  }

  // ---- Guards using text-only popup ----
  if (pages[currentPageIndex].isTOC) {
    showPopup("You cannot delete the Table of Contents page.");
    return;
  }
  if (pages.length <= 1) {
    showPopup("You must have at least one page.");
    return;
  }

  // ---- Confirm deletion ----
  const shouldDelete = await showDeletePagePopup();
  if (!shouldDelete) return;

  // ---- Proceed with deletion ----
  const deletedIndex = currentPageIndex; // zero-based
  pages.splice(currentPageIndex, 1);

  // Fix chapter page numbers and remove chapters that pointed to the deleted page
  chapters = chapters
    .filter(ch => ch.page !== deletedIndex + 1) // remove chapters on deleted page
    .map(ch => ({
      ...ch,
      page: ch.page > deletedIndex + 1 ? ch.page - 1 : ch.page // shift pages after deletion
    }));

  if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1;

  // Refresh TOC and UI
  pages[0].content = generateTOCContent();
  loadPage();
  updatePageCounter();
  renderChapterTabs();
}

        function setupCanvas() {
            console.log('Setting up canvas...');
            const canvas = document.getElementById('drawingCanvas');
            const editor = document.getElementById('editor');
            
            if (!canvas) {
                console.error('Canvas element not found! Available elements:', document.querySelectorAll('canvas'));
                return;
            }
            if (!editor) {
                console.error('Editor element not found!');
                return;
            }
            
            console.log('Canvas and editor found, setting up...');
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                if (!editor || !canvas) return;
                
                const editorRect = editor.getBoundingClientRect();
                const parentRect = editor.parentElement.getBoundingClientRect();
                
                // Set canvas size to match the editor's parent container
                canvas.width = parentRect.width;
                canvas.height = parentRect.height;
                canvas.style.width = parentRect.width + 'px';
                canvas.style.height = parentRect.height + 'px';
                
                console.log('Canvas resized to:', canvas.width, 'x', canvas.height);
                redrawAllStrokes();
            }
            
            // Initial resize
            setTimeout(resizeCanvas, 200);
            window.addEventListener('resize', resizeCanvas);

            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            canvas.addEventListener('pointerdown', (e) => {
  if (!isDrawingMode) return;

  // capture pointer so we keep getting move events while dragging
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

  isDrawing = true;
  const rect = canvas.getBoundingClientRect();
  lastX = e.clientX - rect.left;
  lastY = e.clientY - rect.top;

  const color = isEraserMode ? 'ERASER' : document.getElementById('drawingColorPicker').value;
const size = parseInt(document.getElementById('brushSize').value);

currentStroke = [{
  x: lastX,
  y: lastY,
  color: color,
  size: size
}];

  // keep the dot pinned to the cursor at drag start
  const cursor = document.getElementById('drawingCursor');
  if (isDrawingMode && cursor) {
    cursor.style.left = (e.clientX - 4) + 'px';
    cursor.style.top  = (e.clientY - 4) + 'px';
  }

  e.preventDefault();
  e.stopPropagation();
});

canvas.addEventListener('pointermove', (e) => {
  // always move the dot while in drawing mode
  const cursor = document.getElementById('drawingCursor');
  if (isDrawingMode && cursor) {
    cursor.style.left = (e.clientX - 4) + 'px';
    cursor.style.top  = (e.clientY - 4) + 'px';
  }

  if (!isDrawing || !isDrawingMode) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const size = parseInt(document.getElementById('brushSize').value);

  if (isEraserMode) {
    // Eraser mode: use destination-out composite operation
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)'; // doesn't matter for destination-out
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();

    currentStroke.push({ x, y, color: 'ERASER', size });
  } else {
    // Normal brush mode
    const color = document.getElementById('drawingColorPicker').value;
    
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();

    currentStroke.push({ x, y, color, size });
  }

  lastX = x;
  lastY = y;

  e.preventDefault();
  e.stopPropagation();
});

canvas.addEventListener('pointerup', (e) => {
  if (isDrawing && currentStroke.length > 0) {
    drawingStrokes.push([...currentStroke]);
    pages[currentPageIndex].drawings = [...drawingStrokes];
    saveCurrentPage();
  }
  isDrawing = false;
  currentStroke = [];
  redoStrokes = [];

  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

  e.preventDefault();
  e.stopPropagation();
});

            });

        function redrawAllStrokes() {
    const canvas = document.getElementById('drawingCanvas');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawingStrokes.forEach(stroke => {
        if (stroke.length > 1) {
            const isEraser = stroke[0].color === 'ERASER';
            
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = stroke[0].color;
            }
            
            ctx.lineWidth = stroke[0].size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(stroke[0].x, stroke[0].y);
            
            for (let i = 1; i < stroke.length; i++) {
                ctx.lineTo(stroke[i].x, stroke[i].y);
            }
            ctx.stroke();
        }
    });
    
    // Reset to normal drawing mode
    ctx.globalCompositeOperation = 'source-over';
}

            const tempDiv = document.createElement('div');

            const h1 = tempDiv.querySelector('h1');
            const h2 = tempDiv.querySelector('h2');
            const h3 = tempDiv.querySelector('h3');
            
            if (h1) return h1.textContent;
            if (h2) return h2.textContent;
            if (h3) return h3.textContent;
            
            const firstP = tempDiv.querySelector('p');
            if (firstP) {
                const text = firstP.textContent.trim();
                return text.length > 50 ? text.substring(0, 50) + '...' : text;

        function saveCurrentPage() {

        function getSelectedImageWrapper() {
  return document.querySelector('.image-wrapper.selected');
}
function getImageTarget(wrapper) {
  return wrapper?.querySelector('.polaroid .photo')
      || wrapper?.querySelector('img:not(.frame), video')
      || null;
}

function getImageSettings(wrapper) {
  const d = wrapper?.dataset || {};
  return {
    opacity:   d.opacity   ? parseFloat(d.opacity)   : 1,
    saturation:d.saturation? parseInt(d.saturation)  : 100,
    warmth:    d.warmth    ? parseInt(d.warmth)      : 0,
    bw:        d.bw === '1',
    vintage:   d.vintage === '1'
  };
}
function setImageSettings(wrapper, s) {
  const d = wrapper.dataset;
  d.opacity    = String(s.opacity);
  d.saturation = String(s.saturation);
  d.warmth     = String(s.warmth);
  d.bw         = s.bw ? '1' : '0';
  d.vintage    = s.vintage ? '1' : '0';
}

function buildFilterFromSettings(s) {
  const filters = [];
  filters.push(`saturate(${Math.max(0, s.saturation)}%)`);
  if (s.warmth !== 0) {
    const w = Math.max(-100, Math.min(100, s.warmth));
    const sep = Math.abs(w) * 0.4;
    const hue = w > 0 ? -10 : 10;
    const brt = 100 + w * 0.15;
    filters.push(`sepia(${sep}%) hue-rotate(${hue}deg) brightness(${brt}%)`);
  }
  if (s.bw) filters.push('grayscale(100%)');
  if (s.vintage) filters.push('sepia(35%) contrast(90%) brightness(105%) saturate(120%)');
  return filters.join(' ');
}

function applyImageSettings(wrapper, s) {
  const target = getImageTarget(wrapper);
  if (!target) return;
  target.style.opacity = String(s.opacity);
  target.style.filter  = buildFilterFromSettings(s);
  setImageSettings(wrapper, s);
  saveCurrentPage();
}

function imgControlsSyncToUI(wrapper) {
  const s = getImageSettings(wrapper);
  const $ = (id) => document.getElementById(id);
  if ($('imgOpacity'))   $('imgOpacity').value    = Math.round(s.opacity * 100);
  if ($('imgSaturation'))$('imgSaturation').value = s.saturation;
  if ($('imgWarmth'))    $('imgWarmth').value     = s.warmth;
  if ($('imgBW'))        $('imgBW').checked       = s.bw;
  if ($('imgVintage'))   $('imgVintage').checked  = s.vintage;
}

function imgControlsApplyFromUI() {
  const w = getSelectedImageWrapper();
  if (!w) return;
  const $ = (id) => document.getElementById(id);
  const s = {
    opacity:    Math.max(0, Math.min(1, (parseInt($('imgOpacity').value)||100)/100)),
    saturation: parseInt($('imgSaturation').value)||100,
    warmth:     parseInt($('imgWarmth').value)||0,
    bw:         !!$('imgBW').checked,
    vintage:    !!$('imgVintage').checked
  };
  applyImageSettings(w, s);
}

  <div class="popup-box" role="dialog" aria-modal="true" style="
    background: url('Images/LeftBarPaper.png') center/cover no-repeat;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
    background-color: transparent;
    min-width: 400px;
    min-height: 300px;
  ">
    <div style="padding: 2rem;">
      <h3 style="margin:0 0 1rem 0; color:#333; font-family:'Biro Script Plus';">Choose a Frame</h3>
      <div class="frame-grid" style="
        display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
        gap:10px; max-height:50vh; overflow:auto; padding:2px;">
      </div>
      <div class="popup-buttons" style="margin-top:1rem;">
        <button class="popup-btn cancel" style = "color: black; font-size: 1.2rem;">Close</button>
      </div>
    </div>
  </div>
`;
  document.body.appendChild(overlay);

  const grid = overlay.querySelector('.frame-grid');

  // Render thumbnails
  FRAME_PATHS.forEach((src) => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.style.cssText = `
      background:#f8f9fa; border:1px solid #e1e5ea; border-radius:8px; padding:6px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:transform .15s ease, box-shadow .15s ease;
    `;
    cell.title = src.split('/').pop();
    cell.innerHTML = `
      <img src="${src}" alt="" style="max-width:100%; max-height:90px; display:block;">
    `;
    cell.addEventListener('click', () => {
      setPolaroidFrame(wrapper, src);
      try { document.body.removeChild(overlay); } catch {}
    });
    cell.addEventListener('mouseenter', () => { cell.style.transform = 'translateY(-2px)'; cell.style.boxShadow = '0 4px 14px rgba(0,0,0,.08)'; });
    cell.addEventListener('mouseleave', () => { cell.style.transform = ''; cell.style.boxShadow = ''; });
    grid.appendChild(cell);
  });

  // Close handlers
  const cleanup = () => { try { document.body.removeChild(overlay); } catch {} };
  overlay.querySelector('.cancel').addEventListener('click', cleanup);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(); });
}

function imgControlsReset() {
  const w = getSelectedImageWrapper();
  if (!w) return;
  const s = { opacity:1, saturation:100, warmth:0, bw:false, vintage:false };
  applyImageSettings(w, s);
  imgControlsSyncToUI(w);
}

document.addEventListener('dblclick', function(e) {

        function addVideo() {
  if (pages[currentPageIndex].isTOC) {
  const overlay = document.createElement('div');
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9999;";
  overlay.innerHTML = `
    <div role="dialog" aria-modal="true"
         style="position:relative;width:min(90vw,520px);aspect-ratio:4/3;">
      <img src="Images/Popup.png" alt=""
           style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;">
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:20px;">
        <p style="margin:0;color:#222;font-family:'Biro Script Plus',cursive;font-size:22px;text-align:center;">
          Cannot add video to Table of Contents page
        </p>
        <button class="ok"
          style="background:transparent;border:none;font-family:'Biro Script Plus',cursive;font-size:24px;color:#222;cursor:pointer;padding:6px 14px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 0 #00000022;transition:transform .12s ease,opacity .12s ease;">
          OK
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector('.ok').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  window.addEventListener('keydown', function esc(e){ if (e.key === 'Escape') { close(); window.removeEventListener('keydown', esc);} });

  return;
}

  // Build a wrapped video that uses a frame behind it
  function makeWrappedVideo(src) {
    const wrapper = document.createElement('div');
    wrapper.className = 'image-wrapper';
    wrapper.setAttribute('data-id', Date.now());

    // Container that mimics polaroid behavior
    const vpol = document.createElement('div');
    vpol.className = 'video-polaroid';
    vpol.style.width = '300px';     // initial; user can resize via handle
    vpol.draggable = false;

    // Frame BEHIND the video
    const frame = document.createElement('img');
    frame.className = 'frame';
    frame.src = 'Images/VideoFrame.png';
    frame.alt = '';

    // When frame loads, lock container aspect ratio to frame image
    frame.onload = () => {
      if (frame.naturalWidth && frame.naturalHeight) {
        vpol.style.aspectRatio = `${frame.naturalWidth} / ${frame.naturalHeight}`;
      }
    };

    // Actual video inside the frame window
    const video = document.createElement('video');
    video.src = src;
    video.controls = true;
    video.draggable = false;

    // Controls/handles (same UI as images)
    const controls = document.createElement('div');
    controls.className = 'image-controls';
    controls.innerHTML = `
      <button onclick="deleteImage(this)" title="Delete">🗑️</button>
      <button onclick="duplicateImage(this)" title="Duplicate">📋</button>
      <button onclick="viewImage(this)" title="View">🔍</button>
    `;

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'resize-handle';

    const rotationHandle = document.createElement('div');
    rotationHandle.className = 'rotation-handle';

    // Assemble: frame (behind), then video (above)
    vpol.appendChild(frame);
    vpol.appendChild(video);

    wrapper.appendChild(vpol);
    wrapper.appendChild(controls);
    wrapper.appendChild(resizeHandle);
    wrapper.appendChild(rotationHandle);

    (document.querySelector('#editor .page-body') || document.getElementById('editor'))
      .appendChild(wrapper);

    wrapper.contentEditable = 'false';
    wrapper.querySelectorAll('*').forEach(el => {
        el.contentEditable = 'false';
        el.draggable = false;
    });
    wrapper.contentEditable = 'false';
    wrapper.querySelectorAll('*').forEach(el => {
        el.contentEditable = 'false';
        el.draggable = false;
    });
    addImageEventListeners(wrapper);
    saveCurrentPage();
  }

  // Open native picker immediately; store as Data URL (consistent with images)
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/*';
  input.onchange = function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => makeWrappedVideo(ev.target.result);
    reader.readAsDataURL(file);
  };
  input.click();
}

        function changeFont(fontFamily) {
    globalFormatting.fontFamily = fontFamily;
    applyGlobalFormatting();
    saveCurrentPage();
}

        function saveNotebook() {
            saveCurrentPage();
            const notebookData = {
    pages,
    chapters,
    currentPage: currentPageIndex,
    globalFormatting
};
            
            const dataStr = JSON.stringify(notebookData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `notebook-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', () => {
  if (!pages.length) initializeNotebook();
});
        
        // Auto-save every 30 seconds
        setInterval(() => {
            saveCurrentPage();
        }, 30000);
    </script>
